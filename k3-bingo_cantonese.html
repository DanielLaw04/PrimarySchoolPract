<!doctype html><html lang="zh-Hant-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K3 廣東話語音 Bingo</title><style>
:root{--navy:#1b365d;--blue:#e8f4ff;--yellow:#fff4b8;--green:#45b86b;--red:#ef5350}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Microsoft JhengHei","PingFang HK",Arial,sans-serif;color:#17324d;background:linear-gradient(150deg,#e7f6ff,#fff7c9)}main{max-width:880px;margin:auto;padding:22px 16px 34px;text-align:center}h1{margin:0 0 7px;font-size:clamp(28px,6vw,44px);color:var(--navy)}.hint{margin:0 0 18px;font-size:17px}.panel{background:#fff;border-radius:22px;padding:18px;box-shadow:0 7px 25px #1b365d22}.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:9px 0}button{border:0;border-radius:14px;padding:11px 16px;min-height:46px;color:#17324d;background:#e7edf5;font:700 16px inherit;cursor:pointer;box-shadow:0 2px 0 #9aafc4}button.active,button.primary{color:#fff;background:var(--navy);box-shadow:0 2px 0 #0f2038}button.green{color:#fff;background:var(--green);box-shadow:0 2px 0 #247742}.word-box{margin:18px auto 12px;padding:15px;max-width:520px;border:3px dashed #8abbde;border-radius:16px;background:var(--blue)}.label{font-size:15px;color:#486782}#calledWord{min-height:55px;margin-top:4px;font-size:clamp(31px,8vw,53px);font-weight:800;color:#123a60}#status{min-height:24px;margin:8px 0;font-weight:bold;color:#5c3c00}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:620px;margin:18px auto 10px}.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:3px;border:2px solid #a7c4dc;border-radius:13px;color:#193c5b;background:#fff;font-size:clamp(16px,3.7vw,28px);font-weight:800;cursor:pointer;user-select:none;transition:.15s}.cell.marked{color:#134527;background:#9cf0b2;border-color:#3ea65f;text-decoration:line-through}.cell.wrong{color:#fff;background:var(--red);border-color:#bd2323;animation:shake .25s linear 2}.cell.free{color:#704d00;background:var(--yellow);border-color:#e2bd40;font-size:clamp(12px,2.7vw,18px)}@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}.rules{text-align:left;max-width:620px;margin:18px auto 0;padding:13px 18px;border-radius:14px;background:#fff0f5;font-size:15px;line-height:1.65}@media(max-width:400px){main{padding:12px 8px 24px}.panel{padding:14px 9px}.grid{gap:4px}.cell{border-radius:9px}.buttons button{padding:9px 11px;font-size:14px}}
</style></head><body><main><h1>🔊 K3 廣東話 Bingo</h1><p class="hint">中文及數字以廣東話讀出；English 版讀英文。</p><section class="panel"><div class="buttons"><button class="active" data-mode="chinese">中文（廣東話）</button><button data-mode="english">English</button><button data-mode="numbers">數字（廣東話）</button></div><div class="buttons"><button class="active" data-level="easy">初階：顯示文字</button><button data-level="hard">進階：只聽讀音</button></div><div class="word-box"><div class="label" id="boxLabel">電腦讀出：</div><div id="calledWord">準備好未？</div></div><div class="buttons"><button id="startBtn" class="primary">▶ 開始遊戲</button><button id="repeatBtn">🔊 再讀一次</button><button id="newBtn" class="green">🔄 新卡</button></div><div id="status" role="status"></div><div id="grid" class="grid"></div></section><div class="rules"><b>答錯提示：</b>按錯格仔會短暫顯示<b style="color:#c62828">紅色</b>，但不會被劃掉；請再聽一次或選另一格。答對則會變綠色。<br><b>進階：</b>只會聽到讀音，畫面不會顯示剛讀出的文字。</div></main><script>
const numWords={1:'一',2:'二',3:'三',4:'四',5:'五',6:'六',7:'七',8:'八',9:'九',10:'十',11:'十一',12:'十二',13:'十三',14:'十四',15:'十五',16:'十六',17:'十七',18:'十八',19:'十九',20:'二十',21:'二十一',22:'二十二',23:'二十三',24:'二十四',25:'二十五'};
const pools={chinese:['一','二','三','四','五','六','七','八','九','十','紅','黃','藍','綠','黑','白','貓','狗','魚','鳥','牛','羊','大','小','日','月','水','火','山','天'],english:['A','B','C','D','E','F','G','H','I','J','Cat','Dog','Sun','Sky','Red','Blue','One','Two','Big','Small','Fish','Bird','Star','Moon','Tree','Book','Ball','Cup'],numbers:Array.from({length:25},(_,i)=>String(i+1))};let mode='chinese',level='easy',card=[],remaining=[],lastWord='',answered=false;const grid=document.querySelector('#grid'),called=document.querySelector('#calledWord'),status=document.querySelector('#status'),label=document.querySelector('#boxLabel');const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function makeCard(){card=shuffle(pools[mode]).slice(0,24);card.splice(12,0,'FREE');remaining=shuffle(pools[mode]);lastWord='';answered=false;setDisplay();status.textContent='已換新卡。';render()}
function setDisplay(){if(level==='hard'){label.textContent='進階模式：請用耳朵聽 👂';called.textContent='？'}else{label.textContent='電腦讀出：';called.textContent=lastWord||'準備好未？'}}
function render(){grid.innerHTML='';card.forEach(item=>{const e=document.createElement('button');e.className='cell'+(item==='FREE'?' free marked':'');e.textContent=item;if(item!=='FREE')e.onclick=()=>choose(e,item);grid.appendChild(e)})}
function choose(el,item){if(!lastWord){status.textContent='請先按「開始遊戲」。';return}if(answered){status.textContent='答啱咗！請按「開始遊戲」聽下一題。';return}if(item===lastWord){el.classList.add('marked');answered=true;status.textContent='✅ 答啱！請按「開始遊戲」聽下一題。';checkBingo()}else{el.classList.remove('wrong');void el.offsetWidth;el.classList.add('wrong');status.textContent='❌ 唔啱呀，再聽一次或試另一格。';setTimeout(()=>el.classList.remove('wrong'),750)}}
function cantoneseVoice(){const vs=speechSynthesis.getVoices();return vs.find(v=>/zh-HK|yue-HK|Cantonese/i.test(v.lang+' '+v.name))||vs.find(v=>/Chinese.*Hong Kong|香港.*中文/i.test(v.name))||null}
function speak(word){if(!('speechSynthesis'in window)){status.textContent='此瀏覽器未支援發聲。';return}speechSynthesis.cancel();let text=word,lang='zh-HK';if(mode==='numbers')text=numWords[Number(word)];if(mode==='english')lang='en-US';const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.68;u.pitch=1.1;const vs=speechSynthesis.getVoices(),v=mode==='english'?vs.find(x=>x.lang.startsWith('en')):cantoneseVoice();if(v)u.voice=v;else if(mode!=='english')status.textContent='未找到廣東話語音，請安裝「中文（香港）」語音。';speechSynthesis.speak(u)}
function nextWord(){if(!remaining.length){remaining=shuffle(pools[mode]);status.textContent='已重新洗牌。'}lastWord=remaining.pop();answered=false;setDisplay();status.textContent=level==='hard'?'請細心聽，然後按卡上相同的格仔。':'請按卡上相同的格仔。';speak(lastWord)}
function checkBingo(){const c=[...document.querySelectorAll('.cell')],ls=[];for(let r=0;r<5;r++)ls.push([0,1,2,3,4].map(x=>r*5+x));for(let x=0;x<5;x++)ls.push([0,1,2,3,4].map(r=>r*5+x));ls.push([0,6,12,18,24],[4,8,12,16,20]);if(ls.some(l=>l.every(i=>c[i].classList.contains('marked')))){status.textContent='🎉 Bingo！你好叻！';speak(mode==='english'?'Bingo! Great job!':'Bingo！你好叻！')}}
document.querySelector('#startBtn').onclick=nextWord;document.querySelector('#repeatBtn').onclick=()=>lastWord?speak(lastWord):status.textContent='請先按「開始遊戲」。';document.querySelector('#newBtn').onclick=makeCard;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));makeCard()});document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;document.querySelectorAll('[data-level]').forEach(x=>x.classList.toggle('active',x===b));setDisplay();status.textContent=level==='hard'?'已選進階模式：題目只會讀出，不會顯示。':'已選初階模式：題目會顯示。'});speechSynthesis.onvoiceschanged=()=>{};makeCard();
</script></body></html>
