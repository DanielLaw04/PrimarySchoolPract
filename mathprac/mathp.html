<style>
/* Art direction: ten-frame orchard → warm storybook learning adventure

:root,[data-theme="light"]{--bg:#fff8e8;--surface:#fffdf6;--surface-2:#f7efd9;--surface-offset:#efe3c6;--surface-dynamic:#e8dab9;--divider:#dacaa7;--border:#cbb98f;--text:#293a2d;--muted:#59685c;--faint:#7d887f;--inverse:#fffdf6;--primary:#26734d;--primary-hover:#1e6040;--primary-active:#174b32;--primary-hi:#d4eadc;--red:#c94236;--red-hi:#f6d8d3;--yellow:#f4c84c;--sky:#d9eef6;--shadow:0 10px 30px oklch(0.34 .04 80/.14);--font-display:'Cabinet Grotesk','Arial Rounded MT Bold',sans-serif;--font-body:'Satoshi','Helvetica Neue',sans-serif;--text-xs:clamp(.75rem,.7rem + .25vw,.875rem);--text-sm:clamp(.875rem,.8rem + .35vw,1rem);--text-base:clamp(1rem,.95rem + .25vw,1.125rem);--text-lg:clamp(1.125rem,1rem + .75vw,1.5rem);--text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);--space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;--space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;--space-12:3rem;--radius-sm:.375rem;--radius-md:.5rem;--radius-lg:.75rem;--radius-xl:1rem;--radius-full:9999px;--ease:220ms cubic-bezier(.16,1,.3,1)}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:none;text-size-adjust:none;font-synthesis:none}body{min-height:100dvh;overflow-x:hidden;font:var(--text-base)/1.5 var(--font-body);color:var(--text);background:var(--bg)}button{font:inherit;color:inherit;cursor:pointer;border:0}button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}.skip{position:fixed;left:var(--space-4);top:-100px;z-index:99;background:var(--text);color:var(--inverse);padding:var(--space-3);border-radius:var(--radius-md)}.skip:focus{top:var(--space-4)}.app{min-height:100dvh;position:relative}.topbar{position:fixed;z-index:30;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) max(var(--space-4),env(safe-area-inset-left));pointer-events:none}.brand,.icon-btn{pointer-events:auto;background:color-mix(in oklch,var(--surface) 90%,transparent);backdrop-filter:blur(12px);box-shadow:0 2px 10px #1d261c1a}.brand{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3);border-radius:var(--radius-full);font-weight:800;font-size:var(--text-sm)}.logo{width:28px;height:28px;color:var(--red)}.tools{display:flex;gap:var(--space-2)}.icon-btn{width:48px;height:48px;border-radius:var(--radius-full);display:grid;place-items:center}.icon-btn:hover{background:var(--surface)}.icon-btn:active,.mode-btn:active,.answer:active,.cta:active{transform:translateY(2px) scale(.98)}.icon-btn svg{width:22px;height:22px}.screen{min-height:100dvh;display:none}.screen.active{display:grid}.start{place-items:center;padding:clamp(var(--space-20,5rem),10vh,7rem) var(--space-4) var(--space-8);background:linear-gradient(#fff8e866,#fff8e8cc),url('./assets/orchard.jpg') center/cover no-repeat}.start-card{width:min(100%,660px);background:color-mix(in oklch,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border:1px solid #fff9;box-shadow:var(--shadow);border-radius:var(--radius-xl);padding:clamp(var(--space-5),5vw,var(--space-10));text-align:center}.eyebrow{font-size:var(--text-xs);font-weight:800;letter-spacing:.13em;color:var(--primary);text-transform:uppercase}.start h1,.result h2{font-family:var(--font-display);font-size:clamp(2.2rem,9vw,4.6rem);line-height:.95;margin:var(--space-3) 0 var(--space-4)}.lead{color:var(--muted);margin:0 auto var(--space-6);max-width:35ch}.label{font-weight:700;font-size:var(--text-sm);margin-bottom:var(--space-2)}.mode-group{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2);margin-bottom:var(--space-5)}.mode-btn{min-height:52px;background:var(--surface-2);border:2px solid transparent;border-radius:var(--radius-lg);font-weight:700;transition:transform var(--ease),background var(--ease),border var(--ease)}.mode-btn[aria-pressed="true"]{background:var(--primary-hi);border-color:var(--primary);color:var(--primary)}.level-row{display:flex;justify-content:center;gap:var(--space-4);margin-bottom:var(--space-6);font-size:var(--text-sm)}.radio{display:flex;align-items:center;gap:var(--space-2);min-height:44px}.radio input{width:20px;height:20px;accent-color:var(--primary)}.cta{min-height:58px;border-radius:var(--radius-lg);padding:0 var(--space-8);background:var(--primary);color:#fff;font-weight:800;font-size:var(--text-lg);box-shadow:0 6px 0 var(--primary-active);transition:transform var(--ease),background var(--ease)}[data-theme="dark"] .cta{color:#132118}.cta:hover{background:var(--primary-hover)}.tiny{margin-top:var(--space-4);font-size:var(--text-xs);color:var(--muted)}
.game{grid-template-rows:auto 1fr;padding:76px var(--space-4) var(--space-5);background:linear-gradient(#fff8e8de,#fff8e8f2),url('./assets/orchard.jpg') center/cover fixed no-repeat}[data-theme="dark"] .game{background:linear-gradient(#18251de8,#18251df5),url('./assets/orchard.jpg') center/cover fixed no-repeat}.hud{width:min(100%,860px);margin:0 auto var(--space-4);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:var(--space-3)}.hud-pill{min-height:44px;display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);border-radius:var(--radius-full);background:var(--surface);box-shadow:0 2px 10px #293a2d12;font-size:var(--text-sm);font-weight:700;white-space:nowrap}.progress{height:14px;border-radius:var(--radius-full);background:var(--surface-offset);overflow:hidden;border:2px solid var(--surface)}.progress-bar{height:100%;width:10%;background:var(--primary);border-radius:inherit;transition:width 500ms cubic-bezier(.16,1,.3,1)}.game-card{align-self:center;width:min(100%,760px);margin:auto;background:var(--surface);border:1px solid color-mix(in oklch,var(--text) 12%,transparent);border-radius:clamp(var(--radius-lg),3vw,var(--radius-xl));padding:clamp(var(--space-4),4vw,var(--space-8));box-shadow:var(--shadow)}.question-top{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3)}.instruction{font-size:var(--text-sm);font-weight:700;color:var(--muted)}.speak-btn{display:flex;align-items:center;gap:var(--space-2);min-height:44px;padding:0 var(--space-3);border-radius:var(--radius-full);background:var(--surface-2);font-weight:700;font-size:var(--text-sm)}.equation{text-align:center;font-family:var(--font-display);font-variant-numeric:tabular-nums;font-size:clamp(3rem,16vw,6.3rem);line-height:1.05;margin:var(--space-2) 0 var(--space-4);letter-spacing:.02em}.ten-frame{width:min(100%,500px);margin:0 auto var(--space-5);display:grid;grid-template-columns:repeat(5,1fr);gap:var(--space-2);padding:var(--space-2);background:var(--surface-offset);border:3px solid var(--text);border-radius:var(--radius-lg)}.cell{aspect-ratio:1;border:2px solid color-mix(in oklch,var(--text) 28%,transparent);border-radius:var(--radius-md);display:grid;place-items:center;background:var(--surface)}.apple{width:70%;height:70%;border-radius:52% 48% 50% 50%;background:var(--red);position:relative;filter:drop-shadow(0 2px 1px #64241f33);animation:pop 300ms cubic-bezier(.34,1.56,.64,1) both}.apple::before{content:"";position:absolute;width:16%;height:28%;background:#61422c;left:48%;top:-20%;transform:rotate(10deg);border-radius:8px}.apple::after{content:"";position:absolute;width:32%;height:20%;background:var(--primary);left:55%;top:-15%;border-radius:100% 0 100% 0;transform:rotate(-12deg)}.apple.second{background:var(--yellow)}.apple.removed{opacity:.25}.apple.removed span{position:absolute;inset:-18%;display:grid;place-items:center;color:var(--red);font:800 2.4rem/1 var(--font-body)}.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-3)}.answer{min-height:72px;background:var(--surface-2);border:2px solid var(--border);border-radius:var(--radius-lg);font-family:var(--font-display);font-size:var(--text-xl);font-weight:800;box-shadow:0 4px 0 var(--border);transition:transform var(--ease),background var(--ease),border var(--ease)}.answer:hover{background:var(--sky);border-color:var(--primary)}.answer.correct{background:var(--primary-hi);border-color:var(--primary);color:var(--primary);animation:bounce 500ms}.answer.wrong{background:var(--red-hi);border-color:var(--red);color:var(--red);animation:shake 380ms}.answer:disabled{cursor:default}.feedback{min-height:34px;margin-top:var(--space-4);text-align:center;font-weight:800;font-size:var(--text-lg)}.feedback.good{color:var(--primary)}.feedback.try{color:var(--red)}
.result{place-items:center;padding:76px var(--space-4) var(--space-8);background:var(--bg)}.result-card{position:relative;overflow:hidden;width:min(100%,720px);min-height:min(78vh,700px);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding:var(--space-8);border-radius:var(--radius-xl);box-shadow:var(--shadow);background:var(--surface)}.victory-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(.9)}.result-scrim{position:absolute;inset:0;background:linear-gradient(transparent 18%,color-mix(in oklch,var(--surface) 94%,transparent) 69%)}.result-content{position:relative;z-index:2}.result h2{font-size:clamp(2.2rem,8vw,4rem);margin-bottom:var(--space-2)}.score-big{font:800 clamp(2rem,8vw,4rem)/1 var(--font-display);color:var(--primary);font-variant-numeric:tabular-nums;margin-bottom:var(--space-3)}.result p{color:var(--muted);margin:0 auto var(--space-5)}.result-actions{display:flex;justify-content:center;gap:var(--space-3);flex-wrap:wrap}.ghost{min-height:52px;padding:0 var(--space-5);border-radius:var(--radius-lg);background:var(--surface-2);border:2px solid var(--border);font-weight:800}.confetti{position:fixed;z-index:50;top:-20px;width:10px;height:18px;animation:fall 2.8s linear forwards;pointer-events:none}.loading{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);transition:opacity 350ms}.loading.hide{opacity:0;pointer-events:none}.loader-logo{width:76px;color:var(--red);animation:pulse 900ms ease-in-out infinite}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}@keyframes bounce{50%{transform:translateY(-8px)}}@keyframes shake{25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(720deg)}}@keyframes pulse{50%{transform:scale(1.12)}}
@media(max-width:560px){.brand span{display:none}.hud{grid-template-columns:auto 1fr}.hud-pill:last-child{grid-column:1/-1;justify-self:center}.answers{grid-template-columns:repeat(2,1fr)}.answer{min-height:64px}.mode-btn{font-size:var(--text-sm)}.level-row{gap:var(--space-2);flex-wrap:wrap}.game-card{padding:var(--space-4)}.result-card{padding:var(--space-5)}}
@media(max-height:700px) and (min-width:700px){.game{padding-top:68px}.game-card{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);align-items:center}.question-top,.feedback{grid-column:1/-1}.equation{margin:0}.ten-frame{margin:0}.answers{grid-template-columns:repeat(2,1fr)}}

<a class="skip" href="#main">跳到遊戲</a>
<div class="loading" id="loading" aria-label="載入遊戲"><svg class="loader-logo" viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="M31 18C18 7 4 18 7 36c2 13 13 22 25 18 12 4 23-5 25-18 3-18-11-29-24-18-1 1-1 1-2 0Z"/><path d="M32 18c0-7 4-11 9-13" fill="none" stroke="#60402c" stroke-width="4" stroke-linecap="round"/><path fill="#26734d" d="M39 7c8-4 14 0 15 6-8 3-13 0-15-6Z"/></svg></div>
<div class="app" id="main">
<header class="topbar"><div class="brand"><svg class="logo" viewBox="0 0 64 64" role="img" aria-label="十格果園標誌"><path fill="currentColor" d="M31 18C18 7 4 18 7 36c2 13 13 22 25 18 12 4 23-5 25-18 3-18-11-29-24-18-1 1-1 1-2 0Z"/><path d="M32 18c0-7 4-11 9-13" fill="none" stroke="#60402c" stroke-width="4" stroke-linecap="round"/><path fill="#26734d" d="M39 7c8-4 14 0 15 6-8 3-13 0-15-6Z"/></svg><span>十格果園</span></div><div class="tools"><button class="icon-btn" id="soundToggle" aria-label="關閉音效" title="音效"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path class="sound-wave" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/></svg></button><button class="icon-btn" id="themeToggle" aria-label="切換深色模式" title="明暗模式"><svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div></header>
<section class="screen start active" id="startScreen" aria-labelledby="gameTitle"><div class="start-card"><p class="eyebrow">1–10 加減法小挑戰</p><h1 id="gameTitle">十格果園</h1><p class="lead">幫松鼠收集蘋果！看圖、心算，連續答對便會得到更多星星。</p><p class="label">今天想練習甚麼？</p><div class="mode-group" role="group" aria-label="選擇運算"><button class="mode-btn" data-mode="add" aria-pressed="false">加法 ＋</button><button class="mode-btn" data-mode="subtract" aria-pressed="false">減法 −</button><button class="mode-btn" data-mode="mixed" aria-pressed="true">混合練習</button></div><p class="label">選擇難度</p><div class="level-row"><label class="radio"><input type="radio" name="level" value="5">暖身（1–5）</label><label class="radio"><input type="radio" name="level" value="10" checked>挑戰（1–10）</label></div><button class="cta" id="startBtn">開始收蘋果</button><p class="tiny">每局 10 題・沒有倒數計時・可以慢慢想</p></div></section>

<section class="screen result" id="resultScreen" aria-labelledby="resultTitle"><article class="result-card"><img class="victory-art" src="./assets/victory.jpg" alt="小松鼠舉起星星獎章慶祝" width="1122" height="1402"><div class="result-scrim"></div><div class="result-content"><p class="eyebrow">果園任務完成</p><h2 id="resultTitle">做得好！</h2><div class="score-big"><span id="finalScore">10</span> / 10</div><p id="resultMessage">你已經收集了一籃蘋果！</p><div class="result-actions"><button class="cta" id="againBtn">再玩一次</button><button class="ghost" id="menuBtn">返回選單</button></div></div></article></section>
</div>
